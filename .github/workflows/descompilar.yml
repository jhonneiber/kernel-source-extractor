name: RemoteDesktop_Auto

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Limpieza y Actualización Forzada
        run: |
          sudo apt-get clean
          sudo apt-get update --fix-missing
      
      - name: Instalando Escritorio y Chrome Remote Desktop
        # Añadimos -y y --fix-broken para evitar el Error 100
        run: |
          sudo apt-get install -y --fix-broken xfce4 xfce4-terminal
          wget https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb
          sudo apt-get install -y ./chrome-remote-desktop_current_amd64.deb
      
      - name: Iniciando Acceso Remoto
        env:
          AUTH_CODE: ${{ secrets.CHROME_REMOTE_DESKTOP_CODE }}
        run: |
          DISPLAY= /opt/google/chrome-remote-desktop/start-host \
          --code="$AUTH_CODE" \
          --redirect-url="https://remotedesktop.google.com/_/oauthredirect" \
          --name=$(hostname) \
          --pin=123456
          
      - name: Mantener activo
        run: |
          echo "Si el círculo sigue verde, entra en remotedesktop.google.com/access"
          sleep 6h
