# .github/workflows/kernel-build.yml
name: Kernel Source Extractor

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Permitir ejecución manual

jobs:
  test-multi-os:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]  # Testear en múltiples sistemas
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup environment
        run: |
          echo "🖥️  Running on: ${{ matrix.os }}"
          echo "🔧 Kernel extractor build starting..."
          
      # ✅ Solo si es proyecto Node.js
      - name: Setup Node (if needed)
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install deps (if Node project)
        if: ${{ hashFiles('package.json') != '' }}
        run: npm ci
      
      # ✅ Comandos genéricos de build
      - name: Build
        run: |
          if [ -f "Makefile" ]; then
            echo "🔨 Using Makefile..."
            make
          elif [ -f "CMakeLists.txt" ]; then
            echo "🔨 Using CMake..."
            mkdir -p build && cd build
            cmake .. && make
          elif [ -f "package.json" ]; then
            echo "🔨 Using npm..."
            npm run build
          else
            echo "⚠️  No build system detected"
            echo "📁 Files in repo:"
            ls -la
          fi
      
      - name: Run tests
        run: |
          if [ -f "Makefile" ] && grep -q "test:" Makefile; then
            make test
          elif [ -f "package.json" ] && npm run test --if-present; then
            npm test
          else
            echo "✅ No tests configured, skipping"
          fi
      
      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-extractor-${{ matrix.os }}
          path: |
            build/
            dist/
            *.elf
            *.bin
          retention-days: 14
