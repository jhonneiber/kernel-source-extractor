name: RemoteDesktop_Auto

on: 
  workflow_dispatch: # Ahora solo le das al botón verde y listo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Instalando Escritorio y Herramientas
        run: |
          sudo apt update
          sudo apt install -y xfce4 xfce4-terminal chrome-remote-desktop
      
      - name: Iniciando Acceso Remoto Automático
        run: |
          DISPLAY= /opt/google/chrome-remote-desktop/start-host \
          --code="${{ secrets.CHROME_REMOTE_DESKTOP_CODE }}" \
          --redirect-url="https://remotedesktop.google.com/_/oauthredirect" \
          --name=$(hostname) \
          --pin=123456
          
      - name: Mantener activo
        run: |
          echo "Conexión establecida. Entra en remotedesktop.google.com/access"
          sleep 6h
